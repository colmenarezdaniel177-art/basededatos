<head>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main style="display: flex; justify-content: center; align-items: center; flex: 1;">
        <section class="login-section">
            <h1>Bienvenido a <span class="highlight">Ozono Vital</span></h1>
            <p class="login-subtitle">Inicia sesión para continuar</p>
            <form action="../index.html" method="GET" class="login-form">
                <input type="text" name="usuario" placeholder="Usuario" required>
                <input type="password" name="contrasena" placeholder="Contraseña" required>
                <button type="submit">Iniciar sesión</button>
            </form>
            <p class="signup-text" style="margin-top: 15px;">¿No tienes cuenta? <a href="#">Regístrate</a></p>
        </section>
    </main>
</body>
